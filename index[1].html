<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebESK Al-Falah</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="loginView" class="login-shell">
    <div class="login-card">
      <div class="brand-mark">AF</div>
      <h1>WebESK Al-Falah</h1>
      <p>Sistem Kepegawaian & Keuangan Pondok Pesantren</p>
      <label>Peran Akses</label>
      <select id="roleSelect">
        <option value="admin">Administrator</option>
        <option value="mudir">Mudir / Pimpinan</option>
        <option value="sdm">Petugas SDM</option>
        <option value="keuangan">Bendahara</option>
        <option value="auditor">Auditor Internal</option>
        <option value="viewer">Viewer</option>
      </select>
      <label>PIN</label>
      <input id="pinInput" type="password" maxlength="6" inputmode="numeric" placeholder="Masukkan 6 digit PIN" />
      <button id="loginBtn">Masuk</button>
      <div id="loginError" class="error"></div>
      <details>
        <summary>Akun demo</summary>
        <div class="demo-list">
          <span>Admin: 123456</span><span>Mudir: 111111</span>
          <span>SDM: 222222</span><span>Keuangan: 333333</span>
          <span>Auditor: 444444</span><span>Viewer: 555555</span>
        </div>
      </details>
    </div>
  </div>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark small">AF</div>
        <div><strong>WebESK</strong><small>Al-Falah</small></div>
      </div>
      <nav id="menu"></nav>
      <button id="logoutBtn" class="logout">Keluar</button>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <h2 id="pageTitle">Dashboard</h2>
          <p id="pageSubtitle">Ringkasan sistem</p>
        </div>
        <div class="user-chip">
          <span id="userRole"></span>
          <span class="status-dot"></span>
        </div>
      </header>
      <section id="content"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button id="closeModal" class="close">×</button>
      <h3 id="modalTitle">Tambah Data</h3>
      <form id="dataForm"></form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
